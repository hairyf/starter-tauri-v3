[package]
name = "starter-tauri-v3"
version = "0.1.0"
description = "Experimental Tauri v3 starter"
authors = ["hairyf"]
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[lib]
name = "starter_tauri_v3_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.4", features = [] }

[dependencies]
tauri = { version = "3.0.0-alpha.5", features = ["unstable", "tray-icon", "image-png", "protocol-asset"] }
tauri-runtime-electron = { path = "../../tauri-runtime-electron" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
