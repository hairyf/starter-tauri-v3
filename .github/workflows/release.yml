name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: ubuntu-latest
          # Windows installer bundling is blocked by the alpha CEF distribution, see README.
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libnss3-dev \
            libgbm-dev \
            libasound2-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev \
            patchelf

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/tauri-cef
            ~/Library/Caches/tauri-cef
            ~/AppData/Local/tauri-cef
          key: cef-3.0.0-alpha.6-${{ runner.os }}

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: starter-tauri-v3 v__VERSION__
          releaseBody: Experimental Tauri v3 build on CEF.
          releaseDraft: true
          prerelease: true
